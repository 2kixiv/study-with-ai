services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_db"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:

